spring.application.name=social-media-dashboard
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/social_media_dashboard?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Abhi@Babbu17

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Replace this with a long random secret (at least 32 bytes) before deployment.
app.jwt.secret=change-this-demo-secret-key-to-a-long-random-string-123456789
app.jwt.expiration-ms=86400000

# Spring Boot JavaMailSender SMTP Configuration
# Supports Gmail SMTP with App Password or custom SMTP provider via environment variables
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8

# Branding and sender address
app.mail.from=${APP_MAIL_FROM:noreply@klmedia.com}
app.mail.sender-name=KLMedia Team

